# ============================================================================
# 期刊分级与指标表（分级规则的「数据来源」）
# ----------------------------------------------------------------------------
# 用途：
#   1) ragcore/journals.py 读取本表 → 写入数据库 journals 表
#      → 检索时按「档位」给 journal 因子打分（替代原先的硬编码期刊权重）；
#   2) 同时导出 journal_index.tsv，供 PDF 元数据抽取阶段把缩写刊名
#      （Appl Microbiol Biotechnol / Glob Change Biol / AMB Expr …）映射为规范全名。
#
# 数据来源与口径（重要）：
#   * jif  = 2025 年度 Journal Impact Factor（科睿唯安 JCR 2026 年 6 月发布），
#            来自公开检索结果（期刊官网 / 科研通 / 恩特学术 / justscience / 维普 等）。
#   * quartile = 该刊原文标注的 JCR 分区（多学科期刊取收录学科中的最优分区）。
#   * 每条记录都带 source 与 evidence，便于人工复核；凡来源互相冲突或未能检索到的，
#     一律留空并交给 AI 兜底（见 sources.ai_fallback），**不臆造数值**。
#
# 档位规则（用户口径，由代码确定性计算，AI 只负责提供 jif / quartile）：
#   1 档 旗舰顶刊            Nature / Science / Cell
#   2 档 三大刊子刊          Nature 系列、Science 系列（正刊外）、Cell Press 系列、npj 系列
#   3 档 领域顶刊            JCR Q1 且 JIF ≥ 8
#   4 档 Q2 / Q1 中段        JCR Q2，或 JCR Q1 但 4 ≤ JIF < 8
#   5 档 Q3 / 低分           JCR Q3，或 1 ≤ JIF < 4
#   6 档 Q4 / 极低           JCR Q4，或 JIF < 1
#   未知                     无 jif 也无 quartile → 用 tiering.scores.unknown
# ============================================================================

meta:
  version: "1.0"
  jcr_year: 2025                    # 影响因子所属年度
  published_at: "2026-06"           # JCR 发布批次
  updated_at: "2026-10-15"
  maintainer: "人工复核 + AI 兜底"

# ===== 分级规则 =====
tiering:
  # 各档在融合分中的取值（0..1）
  scores:
    1: 1.00
    2: 0.85
    3: 0.70
    4: 0.50
    5: 0.30
    6: 0.10
    unknown: 0.45
  names:
    1: "旗舰顶刊（Nature/Science/Cell）"
    2: "三大刊子刊（Nature/Science/Cell 系列）"
    3: "领域顶刊（JCR Q1 且 JIF≥8）"
    4: "Q2 或 Q1 中段（JIF 4–8）"
    5: "Q3 或低分（JIF 1–4）"
    6: "Q4 或极低（JIF<1）"
    unknown: "未知（无指标）"
  # JIF 分档阈值（仅用于 3/4/5/6 档的判定）
  jif_bands:
    tier3_min: 8.0
    tier4_min: 4.0
    tier5_min: 1.0
  # 1 档：白名单（归一化后完全相等才命中，避免 "Science Advances" 被当成 Science）
  flagship:
    - "Nature"
    - "Science"
    - "Cell"
  # 2 档：子刊正则（对归一化小写刊名匹配）
  subjournal_patterns:
    - '^nature\s'
    - '^nature$'
    - '^npj\s'
    - '^science\s+(advances|immunology|robotics|signaling|translational medicine)$'
    - '^cell\s+\S'
    - '^(molecular cell|developmental cell|cancer cell|current biology|immunity|neuron|joule|chem|matter|one earth|med|patterns|structure|cell reports medicine|iscience)$'
    - '^trends in\s'
  # 报告口径：当 jif 与 quartile 冲突时的取舍（quartile 优先，jif 只在 Q1 内部分档）
  rule_note: "档位按 quartile 定档（Q1→3/4、Q2→4、Q3→5、Q4→6）；Q1 内再以 JIF≥8 区分 3 档与 4 档。仅有 JIF 时按 jif_bands 定档。"

# ===== AI 兜底（表中没有的期刊）=====
sources:
  ai_fallback:
    enabled: true                 # 是否允许调用 LLM 补全（--no-llm 可关闭）
    model: "deepseek-chat"
    temperature: 0.0
    max_tokens: 400
    require_evidence: true        # 强制模型给出依据，否则视为不可信并留空
    mark_source: "ai"             # 写入 journals.source 的标记

# ===== 期刊指标（人工复核表）=====
